<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" role="img" aria-label="Dr. Monika Singh logo">
  <defs>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c1e24"/>
      <stop offset="100%" stop-color="#b85a3e"/>
    </linearGradient>
  </defs>

  <!-- Monogram mark -->
  <g transform="translate(8 10)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="url(#markGrad)"/>
    <!-- Inner gold frame -->
    <rect x="6" y="6" width="68" height="68" rx="12" fill="none"
          stroke="#e8c988" stroke-width="0.9" opacity="0.55"/>
    <!-- Decorative flourish above M -->
    <path d="M25 22 Q40 16 55 22" stroke="#e8c988" stroke-width="1" fill="none" opacity="0.75"/>
    <circle cx="40" cy="19" r="1.2" fill="#e8c988"/>
    <!-- Italic serif M -->
    <text x="40" y="60" text-anchor="middle"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="54" font-style="italic" font-weight="500"
          fill="#e8c988">M</text>
    <!-- Tiny flourish below -->
    <path d="M30 70 Q40 74 50 70" stroke="#e8c988" stroke-width="0.8" fill="none" opacity="0.6"/>
  </g>

  <!-- Divider -->
  <line x1="100" y1="24" x2="100" y2="76" stroke="#b85a3e" stroke-width="1.2" opacity="0.6"/>

  <!-- Wordmark -->
  <g transform="translate(112 0)" fill="#1a1410">
    <text x="0" y="46" font-family="Cormorant Garamond, Georgia, serif"
          font-size="28" font-weight="500" letter-spacing="0.5">
      Dr. Monika Singh
    </text>
    <text x="0" y="70" font-family="Inter, system-ui, sans-serif"
          font-size="9" letter-spacing="2.4" fill="#76665c"
          font-weight="500" text-transform="uppercase">
      ORAL &#38; MAXILLOFACIAL SURGEON
    </text>
  </g>
</svg>
